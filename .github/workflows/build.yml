name: Build & Test

on:
  push:
  pull_request:

permissions:
  contents: write
  checks: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v6
      with:
        java-version: '26'
        distribution: 'oracle'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Publish JUnit Test Report
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce
      with:
        include_passed: true
        detailed_summary: true
        report_paths: '**/target/surefire-reports/TEST-*.xml'
